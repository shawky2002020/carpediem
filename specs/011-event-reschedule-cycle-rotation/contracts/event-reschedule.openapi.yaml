openapi: 3.1.0
info:
  title: Carpediem - Event Reschedule & Staffing Cycle Rotation API
  description: Administrative endpoint for rescheduling published events, sealing current staffing cycles, rotating to new clean cycles, and alerting stakeholders.
  version: 1.0.0
paths:
  /api/events/{eventId}/reschedule:
    post:
      summary: Reschedule published event and rotate staffing cycle
      description: Platform Administrator reschedules a published event's operational window, seals the current staffing cycle immutably, creates a new clean staffing cycle, dispatches notifications, and appends an audit log.
      operationId: RescheduleEvent
      tags:
        - Event Reschedule
      parameters:
        - name: eventId
          in: path
          required: true
          description: Unique identifier of the target event.
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: true
          description: Base64-encoded concurrency token (RowVersion) of the event.
          schema:
            type: string
        - name: X-XSRF-TOKEN
          in: header
          required: true
          description: Antiforgery request token.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescheduleEventRequest'
      responses:
        '200':
          description: Event successfully rescheduled and staffing cycle rotated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RescheduleEventResponse'
        '400':
          description: Malformed request parameters, invalid times, or missing justification.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthenticated session.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden; actor is not a Platform Administrator.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Target event not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Event is not in Published status or the event has already started.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '412':
          description: Concurrency conflict; event was modified concurrently.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal server error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

components:
  schemas:
    RescheduleEventRequest:
      type: object
      required:
        - newStartDateTime
        - newEndDateTime
        - justification
      properties:
        newStartDateTime:
          type: string
          format: date-time
          description: New operational start time in UTC. Must be in the future.
          example: '2026-11-15T09:00:00Z'
        newEndDateTime:
          type: string
          format: date-time
          description: New operational end time in UTC. Must be after new start time.
          example: '2026-11-15T17:00:00Z'
        justification:
          type: string
          minLength: 10
          maxLength: 500
          description: Mandatory administrative reason for rescheduling the event.
          example: 'Venue requested date change due to facility maintenance.'

    RescheduleEventResponse:
      type: object
      required:
        - eventId
        - title
        - status
        - startDateTime
        - endDateTime
        - location
        - activeStaffingCycleId
        - cycleNumber
        - version
        - rescheduledAt
        - notificationsDispatched
      properties:
        eventId:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
          example: 'Published'
        startDateTime:
          type: string
          format: date-time
        endDateTime:
          type: string
          format: date-time
        location:
          type: string
        notes:
          type: string
          nullable: true
        activeStaffingCycleId:
          type: string
          format: uuid
        cycleNumber:
          type: integer
          example: 2
        version:
          type: string
          description: New base64-encoded concurrency token.
        rescheduledAt:
          type: string
          format: date-time
        notificationsDispatched:
          type: integer
          description: Count of in-platform notifications sent to previous stakeholders.

    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          example: 'https://tools.ietf.org/html/rfc9110#section-15.5.10'
        title:
          type: string
          example: 'window_closed'
        status:
          type: integer
          example: 409
        detail:
          type: string
          example: 'The event cannot be rescheduled because its scheduled start time has already passed.'
        instance:
          type: string
          example: '/api/events/a1b2c3d4-e5f6-7890-abcd-ef1234567890/reschedule'
        code:
          type: string
          example: 'window_closed'
