services:
  - type: web
    name: carpediem-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Render web services listen on port 10000 by default. This overrides the
      # container's local-development port without altering its Dockerfile.
      - key: ASPNETCORE_HTTP_PORTS
        value: "10000"
      # Render proxies requests from its private network. Keep this scoped to
      # private address space so client-supplied forwarded headers are not trusted.
      - key: ReverseProxy__TrustedNetworks__0
        value: 10.0.0.0/8
      # Create this secret in Render from the Azure SQL connection string.
      # It is deliberately not committed to source control.
      - key: ConnectionStrings__Carpediem
        sync: false
