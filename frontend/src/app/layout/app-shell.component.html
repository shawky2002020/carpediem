<a class="skip-link" href="#main-content">Skip to content</a>
<header class="site-header">
  <div class="cd-container header-inner">
    <a class="brand" routerLink="/" aria-label="Carpediem home">Carpediem</a>
    <nav aria-label="Primary navigation">
      @if (session.isAdmin()) { <a routerLink="/draft-events">Draft Events</a> }
      @if (!session.isAuthenticated()) { <a routerLink="/sign-in">Sign in</a> }
      @if (session.isAuthenticated()) { <span class="identity">{{ session.session()?.userName }}</span> }
    </nav>
  </div>
</header>
<main id="main-content" class="cd-container page-content" tabindex="-1"><router-outlet /></main>
