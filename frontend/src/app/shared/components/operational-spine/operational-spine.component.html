<div class="event-context">
  <p class="event-title">{{ title() }}</p>
  @if (venue() || schedule()) {
  <p class="event-meta">
    @if (venue()) { <span>{{ venue() }}</span> }
    @if (schedule(); as eventSchedule) {
      <span class="event-schedule">
        <time [attr.datetime]="startDateTime()">{{ eventSchedule.start }}</time>
        @if (eventSchedule.end) {
          <span aria-hidden="true">–</span><span class="cd-visually-hidden">to</span>
          <time [attr.datetime]="endDateTime()">{{ eventSchedule.end }}</time>
        }
        <span>Cairo time</span>
      </span>
    }
  </p>
  }
</div>
